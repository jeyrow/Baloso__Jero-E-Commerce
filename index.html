<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="login-wrapper">
  <div class="login-box">
    <h2 class="title">Login</h2>
    <p class="subtitle"></p>
    <form id="loginForm" novalidate>
      <div class="input-group">
        <label for="username">Email or Username</label>
        <input type="text" id="username" placeholder="Enter your email or username" required />
        <div class="error" id="usernameError"></div>
      </div>
      
      <div class="input-group">
        <label for="password">Password</label>
        <div class="password-container">
          <input type="password" id="password" placeholder="Enter your password" required />
          <span class="toggle-password" id="togglePassword">Show</span>
        </div>      
        <div class="error" id="passwordError"></div>
      </div>
      
      <button type="submit" class="login-button">Log In</button>
      
      <div class="message" id="message"></div>
    </form>
    <div class="file-links">
      <h3>Side Menu Files</h3>
      <ul>
        <li><a href="side-menu.html" target="_blank">side-menu.html</a></li>
        <li><a href="side-menu.css" target="_blank">side-menu.css</a></li>
        <li><a href="side-menu.js" target="_blank">side-menu.js</a></li>
      </ul>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
